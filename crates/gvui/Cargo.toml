[package]
name = "gvui"
version = "0.2.0"
edition = "2021"
description = "High-performance Rust + WebAssembly layout calculation engine for GVUI directed graphs"


# `rlib` in addition to `cdylib` so the crate can be linked by native benchmark and audit
# harnesses without duplicating the source tree.
[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
serde_json = "1.0"
