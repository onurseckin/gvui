services:
  gvui-dev:
    container_name: gvui-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4444:4444"
    volumes:
      - .:/app
      - /app/node_modules
      - cargo-cache:/root/.cargo
      - cargo-target:/app/crates/gvui/target
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_USE_POLLING=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun run -e ''fetch("http://localhost:4444").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        # No `sync` action here on purpose. The `.:/app` bind mount above already makes the host
        # tree live inside the container, so a sync would copy files onto themselves — it never
        # fired once under observation, and all it can contribute is mtime churn for a watcher that
        # is already polling. Hot reload comes from the bind mount plus Vite's polling watcher.
        #
        # A dependency change is the one thing the bind mount cannot handle: `node_modules` is
        # masked by an anonymous volume, so a new package needs the image rebuilt to reinstall.
        - action: rebuild
          path: package.json

volumes:
  cargo-cache:
  cargo-target:
