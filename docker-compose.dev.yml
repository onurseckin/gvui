services:
  gvui-dev:
    container_name: gvui-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_USE_POLLING=true
    healthcheck:
      test: ["CMD-SHELL", "bun run -e 'fetch(\"http://localhost:5173\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
            - dist/
            - docs/
            - crates/
            - target/
            - src/engine/layout/custom/wasm_pkg/
            - scratch/
            - .tmp/
            - "*.tsbuildinfo"
            - "*.log"
        - action: rebuild
          path: package.json
